# Self-hosted Anvesha. Run `docker compose up --build` from the repository root,
# then open http://localhost:8000/docs. Settings come from .env (see .env.example).

name: anvesha

x-backend-env: &backend-env
  ANVESHA_ENV: ${ANVESHA_ENV:-production}
  ANVESHA_DATABASE_URL: postgresql+asyncpg://anvesha:${POSTGRES_PASSWORD:-anvesha}@postgres:5432/anvesha
  ANVESHA_CORS_ORIGINS: ${ANVESHA_CORS_ORIGINS:-http://localhost:3000}
  # Master key for encrypting stored API keys. Leave unset to auto-generate one into the
  # anvesha-secrets volume on first start (back that volume up, or set this explicitly).
  ANVESHA_SECRET_KEY: ${ANVESHA_SECRET_KEY:-}
  ANVESHA_SECRET_KEY_FILE: /var/lib/anvesha/secret.key
  # Optional server-wide provider keys (used when a workspace hasn't added its own).
  ANVESHA_OPENAI_API_KEY: ${ANVESHA_OPENAI_API_KEY:-}
  ANVESHA_ANTHROPIC_API_KEY: ${ANVESHA_ANTHROPIC_API_KEY:-}
  ANVESHA_GEMINI_API_KEY: ${ANVESHA_GEMINI_API_KEY:-}
  ANVESHA_OPENROUTER_API_KEY: ${ANVESHA_OPENROUTER_API_KEY:-}
  ANVESHA_GROQ_API_KEY: ${ANVESHA_GROQ_API_KEY:-}
  ANVESHA_MISTRAL_API_KEY: ${ANVESHA_MISTRAL_API_KEY:-}
  # To use Ollama running on your computer, set this in .env to
  # http://host.docker.internal:11434/v1
  ANVESHA_OLLAMA_BASE_URL: ${ANVESHA_OLLAMA_BASE_URL:-}
  # Web search: the bundled SearXNG is free. Paid APIs are optional.
  ANVESHA_SEARXNG_URL: ${ANVESHA_SEARXNG_URL:-http://searxng:8080}
  ANVESHA_TAVILY_API_KEY: ${ANVESHA_TAVILY_API_KEY:-}
  ANVESHA_BRAVE_API_KEY: ${ANVESHA_BRAVE_API_KEY:-}
  ANVESHA_EXA_API_KEY: ${ANVESHA_EXA_API_KEY:-}
  ANVESHA_DEFAULT_SEARCH_PROVIDER: ${ANVESHA_DEFAULT_SEARCH_PROVIDER:-}
  # Scholarly APIs are free. A contact email gets faster "polite pool" access.
  ANVESHA_SCHOLAR_CONTACT_EMAIL: ${ANVESHA_SCHOLAR_CONTACT_EMAIL:-}
  ANVESHA_OPENALEX_API_KEY: ${ANVESHA_OPENALEX_API_KEY:-}
  ANVESHA_SEMANTIC_SCHOLAR_API_KEY: ${ANVESHA_SEMANTIC_SCHOLAR_API_KEY:-}
  ANVESHA_NCBI_API_KEY: ${ANVESHA_NCBI_API_KEY:-}
  # Uploaded and downloaded PDFs (the anvesha-files volume).
  ANVESHA_STORAGE_DIR: /var/lib/anvesha-files

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: anvesha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anvesha}
      POSTGRES_DB: anvesha
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anvesha -d anvesha"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  searxng:
    # Pinned to a release at least a week old (same supply-chain rule as Python packages).
    image: searxng/searxng:2026.11.15-2d500cb6b
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-anvesha-searxng}
      # Wikipedia and Wikidata results need a contact URL or mailto: for whoever runs
      # this instance (Wikimedia API policy). Without it those two engines stay off.
      SEARXNG_CONTACT_URL: ${SEARXNG_CONTACT_URL:-}
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      # Published on localhost only, for running the backend outside Docker.
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    restart: unless-stopped

  api:
    build: ./backend
    environment: *backend-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - anvesha-secrets:/var/lib/anvesha
      - anvesha-files:/var/lib/anvesha-files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      searxng:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  anvesha-secrets:
  anvesha-files:
