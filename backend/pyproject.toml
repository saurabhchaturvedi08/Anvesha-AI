[project]
name = "anvesha"
version = "0.2.0.dev0"
description = "Open-source agentic research platform with evidence-backed reports"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "openai>=3.0,<4",
  "anthropic>=2.0,<3",
  "httpx2>=2.9,<3",
  "cryptography>=44",
  "genai-prices>=0.2",
  "trafilatura>=2.0",
  "pgvector>=0.3",
  "python-multipart>=0.0.18",
  "defusedxml>=0.7",
  "pypdfium2>=4.30",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anvesha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations keep Alembic's long single-line column definitions.
"alembic/versions/*" = ["E501"]
# Long assertion lines read better unwrapped.
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
# The local alembic/ directory would otherwise make ruff treat Alembic as first-party.
known-third-party = ["alembic"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["anvesha"]
mypy_path = "src"

[tool.uv]
# Supply-chain guard: ignore package releases younger than 7 days. Malicious releases
# (e.g. the 2026 LiteLLM compromises) are usually caught and pulled within hours.
exclude-newer = "7 days"
