# Live evals: runs the golden questions through the real agents with a real (cheap)
# model and fails if the quality gate in evals/golden.toml isn't met. See evals/README.md.
#
# Costs money, so it runs only on demand, weekly, and on pull requests labelled
# `run-evals`. Needs a model key secret (EVAL_OPENAI_API_KEY or another EVAL_*_API_KEY);
# without one it is skipped. The offline half of the gate (the harness on a scripted
# model) runs with every push, in the backend tests (tests/test_evals.py).

name: Evals

on:
  workflow_dispatch:
    inputs:
      model:
        description: "provider:model for every agent role (default: vars.EVAL_MODEL)"
        required: false
      cases:
        description: "Space-separated case ids (default: all)"
        required: false
  schedule:
    - cron: "17 5 * * 1" # Mondays
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-evals')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: anvesha
          POSTGRES_PASSWORD: anvesha
          POSTGRES_DB: anvesha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anvesha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ANVESHA_DATABASE_URL: postgresql+asyncpg://anvesha:anvesha@localhost:5432/anvesha
      ANVESHA_ENV: test
      EVAL_MODEL: ${{ inputs.model || vars.EVAL_MODEL || 'openai:gpt-4o-mini' }}
      EVAL_CASES: ${{ inputs.cases }}
      ANVESHA_OPENAI_API_KEY: ${{ secrets.EVAL_OPENAI_API_KEY }}
      ANVESHA_ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}
      ANVESHA_GEMINI_API_KEY: ${{ secrets.EVAL_GEMINI_API_KEY }}
      ANVESHA_OPENROUTER_API_KEY: ${{ secrets.EVAL_OPENROUTER_API_KEY }}
      # Optional: a search API (cases seed their own sources, so it isn't required).
      ANVESHA_TAVILY_API_KEY: ${{ secrets.EVAL_TAVILY_API_KEY }}
      # Optional: traces of the eval runs in Langfuse, tagged "eval".
      ANVESHA_LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      ANVESHA_LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      ANVESHA_LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST || 'https://cloud.langfuse.com' }}
      ANVESHA_TRACE_CONTENT: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check for a model key
        id: keys
        working-directory: .
        run: |
          if [ -z "${ANVESHA_OPENAI_API_KEY}${ANVESHA_ANTHROPIC_API_KEY}${ANVESHA_GEMINI_API_KEY}${ANVESHA_OPENROUTER_API_KEY}" ]; then
            echo "::notice::No EVAL_*_API_KEY secret is available, so evals are skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.skip != 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.keys.outputs.skip != 'true'
        with:
          enable-cache: true
      - name: Install dependencies
        if: steps.keys.outputs.skip != 'true'
        run: uv sync --locked
      - name: Run evals
        if: steps.keys.outputs.skip != 'true'
        run: |
          args=()
          for case_id in $EVAL_CASES; do args+=(--case "$case_id"); done
          if [ -f ../evals/baseline.json ]; then args+=(--baseline ../evals/baseline.json); fi
          uv run python -m anvesha.evals run ../evals/golden.toml \
            --model "$EVAL_MODEL" --parallel 2 \
            --out "$RUNNER_TEMP/eval-results.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            "${args[@]}"
      - name: Upload results
        if: always() && steps.keys.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: ${{ runner.temp }}/eval-results.json
          if-no-files-found: ignore
